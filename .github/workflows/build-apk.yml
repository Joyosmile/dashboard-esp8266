name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # LANGKAH BARU: Membuat folder android/ dan struktur file lengkap secara otomatis
      - name: Recreate Flutter Project Structure
        run: |
          mkdir temp_project
          cd temp_project
          flutter create --org com.supra.ecu --project-name supra_ecu_dashboard .
          rm -rf lib/main.dart pubspec.yaml
          cd ..
          cp -r temp_project/* .
          rm -rf temp_project

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --split-per-abi --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard-ECU-SupraX
          path: build/app/outputs/flutter-apk/app-release.apk
